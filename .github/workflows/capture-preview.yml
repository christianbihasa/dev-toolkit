name: Automated Live Preview Capture

on:
  workflow_call:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium

      - name: Generate and Run Capture Script
        env:
          DEPLOY_URL: ${{ github.event.deployment_status.target_url }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          cat << 'EOF' > capture.cjs
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            
            await page.setViewportSize({ width: 1000, height: 1300 });
            
            // Uses live deployment target URL, or constructs the GitHub Pages URL as fallback
            const targetUrl = process.env.DEPLOY_URL || `https://${process.env.REPO_OWNER}.github.io/${process.env.REPO_NAME}`;
            console.log(`Capturing preview for: ${targetUrl}`);

            await page.goto(targetUrl, {
              waitUntil: 'networkidle'
            });
            
            await new Promise(resolve => setTimeout(resolve, 4000));
            
            await page.screenshot({ path: 'preview.png' });
            await browser.close();
          })();
          EOF

          node capture.cjs
          rm capture.cjs

      - name: Commit and Push Updated Preview Asset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add preview.png
          git commit -m "chore: automated viewport sync preview image [skip ci]" || exit 0
          git push